<h2>Productos</h2>

@if (ultimoAgregado(); as productoAgregado) {
  <p>
    Último producto agregado:
    {{ productoAgregado.nombre }}
  </p>
}

<div>
  <app-resumen-lista
    [total]="productos().length"
    [favoritos]="favoritos().length">
  </app-resumen-lista>

  @for (producto of productos(); track producto.id) {
    <producto-card
      [producto]="producto"
      [mostrarDescripcion]="true"
      [destacado]="producto.precio > 1000"
      (agregar)="onAgregar($event)"
      (favorito)="onFavorito($event)">
      
    </producto-card>
  }
</div>
